
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172c49">
<title>MyClass - Student Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#24364d;font-family:Arial,sans-serif}
header{background:#172c49;color:white;padding:25px}
header h1{margin:0}
main{max-width:650px;margin:35px auto;padding:15px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 4px 18px #0000000b}
input{width:100%;padding:13px;margin:8px 0 17px;border:1px solid #d8deea;border-radius:9px;font-size:15px}
button{padding:13px;border:0;border-radius:9px;background:#203e63;color:white;cursor:pointer;font-size:14px}
button:disabled{opacity:.5}
.full{width:100%;margin:5px 0}
.secondary{background:#e9eef5;color:#203e63}
label{font-size:14px;font-weight:bold}
#message{padding:12px;border-radius:8px;background:#edf2f8;margin-top:15px;display:none;overflow-wrap:anywhere}
#dashboard{display:none}
.small{color:#778397;font-size:13px}
</style>
</head>
<body>
<header>
<h1>MyClass 🎓</h1>
<p>Student Task Manager</p>
</header>

<main>
<section class="card" id="auth">
<h2 id="formTitle">Selamat Datang!</h2>
<p class="small">Masuk atau buat akun MyClass untuk mengelola perkuliahanmu.</p>

<form id="authForm">
<label>Email</label>
<input id="email" type="email" placeholder="Masukkan email" required>

<label>Password</label>
<input id="password" type="password" placeholder="Minimal 8 karakter" minlength="8" required>

<button class="full" id="loginBtn" type="submit">Masuk</button>
<button class="full secondary" id="signupBtn" type="button">Daftar Akun Baru</button>
</form>
<div id="message" role="status"></div>
</section>

<section class="card" id="dashboard">
<h2>Halo, Angga! 👋</h2>
<p class="small">Kamu berhasil masuk ke MyClass.</p>
<p id="userEmail"></p>
<p>Selamat datang di ruang pengelolaan mata kuliah dan tugasmu.</p>
<button class="full" id="logoutBtn">Keluar dari Akun</button>
</section>
</main>

<script>
const SUPABASE_URL = "TEMPEL_PROJECT_URL_DI_SINI";
const SUPABASE_KEY = "TEMPEL_PUBLISHABLE_KEY_DI_SINI";

const authBox = document.getElementById("auth");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");

let supabaseClient;

function showMessage(text){
  message.style.display = "block";
  message.textContent = text;
}

function showDashboard(user){
  authBox.style.display = "none";
  dashboard.style.display = "block";
  document.getElementById("userEmail").textContent =
    "Akun: " + user.email;
}

function showLogin(){
  authBox.style.display = "block";
  dashboard.style.display = "none";
}

function getClient(){
  if(!SUPABASE_URL.startsWith("https://") ||
     SUPABASE_KEY.startsWith("TEMPEL")){
    showMessage("Isi Project URL dan Publishable Key terlebih dahulu.");
    return false;
  }
  if(!supabaseClient){
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }
  return true;
}

document.getElementById("authForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  if(!getClient())return;

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  loginBtn.disabled=true;
  signupBtn.disabled=true;
  showMessage("Sedang memproses login...");

  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email,password
  });

  loginBtn.disabled=false;
  signupBtn.disabled=false;

  if(error){
    showMessage("Login gagal: "+error.message);
    return;
  }

  showDashboard(data.user);
});

signupBtn.addEventListener("click",async()=>{
  if(!getClient())return;

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email || password.length<8){
    showMessage("Isi email dan password minimal 8 karakter.");
    return;
  }

  loginBtn.disabled=true;
  signupBtn.disabled=true;
  showMessage("Sedang membuat akun...");

  const {data,error}=await supabaseClient.auth.signUp({
    email,
    password,
    options:{
      emailRedirectTo:window.location.origin+window.location.pathname
    }
  });

  loginBtn.disabled=false;
  signupBtn.disabled=false;

  if(error){
    showMessage("Pendaftaran gagal: "+error.message);
    return;
  }

  if(data.session){
    showDashboard(data.user);
  }else{
    showMessage("Pendaftaran berhasil! Periksa email untuk konfirmasi akun, kemudian login.");
  }
});

document.getElementById("logoutBtn").addEventListener("click",async()=>{
  if(!getClient())return;
  const {error}=await supabaseClient.auth.signOut();
  if(error){
    showMessage("Gagal keluar: "+error.message);
    return;
  }
  showLogin();
});

async function checkSession(){
  if(!getClient())return;
  const {data,error}=await supabaseClient.auth.getSession();
  if(error){
    showMessage(error.message);
    return;
  }
  if(data.session){
    showDashboard(data.session.user);
  }
}

if(SUPABASE_URL.startsWith("https://") &&
   !SUPABASE_KEY.startsWith("TEMPEL")){
  checkSession();
}
</script>
</body>
</html>
